<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitControl</title>
    <link rel="icon" type="image/x-icon" href="{{ asset('images/logo.ico') }}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f2351 0%, #1e3a8a 50%, #0f2351 100%);
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
        }

        /* Partículas de fondo */
        .particles {
            position: absolute;
            inset: 0;
            overflow: hidden;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(59, 130, 246, 0.3);
            border-radius: 50%;
            animation: float linear infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                transform: translateY(-100px) scale(1);
                opacity: 0;
            }
        }

        /* Contenedor principal */
        .splash-container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }

        /* Logo con animación de entrada */
        .logo-container {
            position: relative;
            opacity: 0;
            transform: scale(0.5);
            animation: logoEnter 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s forwards;
        }

        @keyframes logoEnter {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Anillo giratorio detrás del logo */
        .logo-ring {
            position: absolute;
            inset: -20px;
            border: 2px solid rgba(59, 130, 246, 0.3);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1.5s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .logo-img {
            width: 200px;
            height: 200px;
            object-fit: contain;
            filter: drop-shadow(0 0 40px rgba(59, 130, 246, 0.4));
        }

        /* Texto con fade in */
        .splash-text {
            text-align: center;
            opacity: 0;
            animation: fadeUp 0.6s ease 0.8s forwards;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .splash-text h1 {
            font-size: 2.5rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
        }

        .splash-text h1 span {
            color: #3b82f6;
        }

        .splash-text p {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 400;
        }

        /* Barra de progreso */
        .progress-bar {
            position: relative;
            width: 180px;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 999px;
            overflow: hidden;
            opacity: 0;
            animation: fadeIn 0.4s ease 1s forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        .progress-fill {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #2563eb, #3b82f6, #60a5fa);
            border-radius: 999px;
            animation: progressFill 2.5s cubic-bezier(0.4, 0, 0.2, 1) 1.2s forwards;
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.5);
        }

        @keyframes progressFill {
            to {
                width: 100%;
            }
        }

        /* Fade out final */
        .splash-container {
            animation: logoEnter 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s forwards;
        }

        .fade-out {
            animation: fadeOut 0.5s ease forwards;
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
            }
        }

        /* Responsive */
        @media (max-width: 640px) {
            .logo-img {
                width: 150px;
                height: 150px;
            }

            .splash-text h1 {
                font-size: 1.8rem;
            }

            .splash-text p {
                font-size: 0.95rem;
            }
        }
    </style>
</head>

<body>
    <!-- Partículas de fondo -->
    <div class="particles" id="particles"></div>

    <!-- Contenido principal -->
    <div class="splash-container" id="splashContainer">
        <div class="logo-container">
            <div class="logo-ring"></div>
            <img src="images/logo.png" alt="FitControl Logo" class="logo-img" />
        </div>

        <div class="splash-text">
            <h1>Fit<span>Control</span></h1>
            <p>Eleva tu entrenamiento al siguiente nivel</p>
        </div>

        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
    </div>

    <script>
        // Leer destino del query parameter
        const params = new URLSearchParams(window.location.search);
        const redirectUrl = params.get('next') || 'admin/login';

        // Generar partículas de fondo
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDuration = (Math.random() * 3 + 2) + 's';
            particle.style.animationDelay = (Math.random() * 3) + 's';
            particle.style.width = (Math.random() * 4 + 2) + 'px';
            particle.style.height = particle.style.width;
            particlesContainer.appendChild(particle);
        }

        // Redirigir al destino después de la animación
        setTimeout(() => {
            document.getElementById('splashContainer').classList.add('fade-out');
            setTimeout(() => {
                window.location.replace(redirectUrl);
            }, 500);
        }, 3000);
    </script>
</body>

</html>
