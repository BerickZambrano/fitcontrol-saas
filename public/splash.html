<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitControl</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }





        .loader {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .logo-container {
            position: relative;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
        }

        .logo-container img {
            width: 45px;
            height: 45px;
            object-fit: contain;
            animation: pulse 2.5s ease-in-out infinite;
            z-index: 10;
        }

        .logo-container:before,
        .logo-container:after {
            content: "";
            display: block;
            position: absolute;
            border-width: 4px;
            border-style: solid;
            border-radius: 50%;
        }

        .logo-container:before {
            width: 80px;
            height: 80px;
            border-bottom-color: #3b82f6;
            border-right-color: #3b82f6;
            border-top-color: transparent;
            border-left-color: transparent;
            top: 0;
            left: 0;
            animation: spin 1s linear infinite;
        }

        .logo-container:after {
            width: 50px;
            height: 50px;
            border-bottom-color: #93c5fd;
            border-right-color: #93c5fd;
            border-top-color: transparent;
            border-left-color: transparent;
            top: 15px;
            left: 15px;
            animation: spin 0.85s linear infinite reverse;
        }

        .brand {
            color: rgba(59, 130, 246, 0.7);
            font-size: 14px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -1px;
            font-style: italic;
        }

        .brand span {
            color: #3b82f6;
        }

        .click-area {
            cursor: pointer;
        }



        .hint-text {
            position: fixed;
            bottom: 24px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 60;
            pointer-events: none;
        }

        .hint-login {
            color: rgba(148, 163, 184, 0.5);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .hint-onboarding {
            color: rgba(59, 130, 246, 0.7);
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.05);
                opacity: 0.8;
            }
        }

        @keyframes loading {
            0% {
                transform: translateX(-100%);
            }

            100% {
                transform: translateX(350%);
            }
        }
    </style>
</head>

<body>



    <div class="loader">
        <div class="logo-container">
            <img src="/images/logo.png" alt="FitControl">
        </div>
        <div class="brand">Fit<span>Control</span></div>
    </div>

    <script>
        // Read destination from URL parameter (?next=/some-url)
        const params = new URLSearchParams(window.location.search);
        const dest = params.get('next') || '/login';
        const targetUrl = dest.startsWith('/') ? dest : '/' + dest;

        // Auto-redirect after loading animation — uses replace to skip splash in history
        setTimeout(() => {
            window.location.replace(targetUrl);
        }, 2000);


    </script>
</body>

</html>
