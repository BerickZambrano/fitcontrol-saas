<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitControl</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        .loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .loader-ring {
            position: relative;
            width: 64px;
            height: 64px;
        }

        .spinner {
            position: absolute;
            inset: 0;
            border: 2px solid rgba(255, 255, 255, 0.07);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
        }

        .logo {
            position: absolute;
            inset: 12px;
            width: 40px;
            height: 40px;
            object-fit: contain;
            opacity: 0.8;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 0.7;
            }
            50% {
                transform: scale(1.05);
                opacity: 0.95;
            }
        }
    </style>
</head>
<body>
    <div class="loader-container">
        <div class="loader-ring">
            <div class="spinner"></div>
            <img class="logo" src="/images/logo.png" alt="FitControl">
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const dest = params.get('next') || '/login';
        const targetUrl = dest.startsWith('/') ? dest : '/' + dest;

        setTimeout(() => {
            window.location.replace(targetUrl);
        }, 1200);
    </script>
</body>
</html>
